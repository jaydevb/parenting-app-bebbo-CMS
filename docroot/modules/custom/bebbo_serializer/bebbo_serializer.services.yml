services:
  bebbo_serializer.encoder.bebbo_json:
    class: Drupal\bebbo_serializer\Encoder\BebboEncoder
    tags:
      - { name: encoder, format: bebbo_json }

  bebbo_serializer.request_format_subscriber:
    class: Drupal\bebbo_serializer\EventSubscriber\RequestFormatSubscriber
    tags:
      - { name: event_subscriber }

  bebbo_serializer.embedded_images_extractor:
    class: Drupal\bebbo_serializer\Service\EmbeddedImagesExtractor
    arguments:
      - '@entity_type.manager'
      - '@file_url_generator'

  bebbo_serializer.body_rendered_processor:
    class: Drupal\bebbo_serializer\Service\BodyRenderedProcessor
    arguments:
      - '@renderer'
